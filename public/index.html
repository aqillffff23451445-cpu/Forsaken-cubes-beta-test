<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forsaken Cubes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d14;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#menu,#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0d14;z-index:50;color:#fff;padding:20px;text-align:center}
#loading{z-index:100;font-size:18px}
h1{font-size:26px;color:#f55;margin-bottom:4px}
.sub{color:#888;margin-bottom:20px;font-size:13px}
.btn{background:#d33;color:#fff;border:none;padding:14px 24px;border-radius:12px;font-size:16px;font-weight:600;margin:7px;min-width:190px}
.btn.blue{background:#36c}.btn.gray{background:#333}
input{background:#1a1a28;border:2px solid #444;color:#fff;padding:12px;border-radius:10px;font-size:16px;text-align:center;width:180px;margin:8px 0}
#status,#status2{margin-top:10px;font-size:13px;color:#f88;min-height:18px}
#hud{position:absolute;top:10px;left:10px;display:none;z-index:20;pointer-events:none}
#role{font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,.65);padding:5px 10px;border-radius:8px;display:inline-block}
#timer{position:absolute;top:10px;right:10px;font-size:18px;font-weight:700;color:#fff;background:rgba(0,0,0,.65);padding:5px 12px;border-radius:8px;display:none}
#hpBar{margin-top:6px;height:8px;background:#333;border-radius:4px;overflow:hidden;width:120px}
#hpFill{height:100%;background:#4c4;width:100%}
#joystick{position:absolute;bottom:28px;left:20px;width:110px;height:110px;display:none;z-index:30}
#joyBase{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);position:relative}
#joyKnob{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.7);position:absolute;top:32px;left:32px}
#attackBtn{position:absolute;bottom:36px;right:26px;width:74px;height:74px;border-radius:50%;background:rgba(200,30,30,.9);border:3px solid #fff;display:none;z-index:30;font-size:12px;font-weight:700;color:#fff;align-items:center;justify-content:center}
#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;color:#fff;text-shadow:0 0 18px #000;display:none;z-index:40;text-align:center}
</style>
</head>
<body>

<div id="loading">Загрузка карты…</div>

<div id="menu" style="display:none">
  <h1>Forsaken Cubes</h1>
  <div class="sub">Мини-версия • GLB карта</div>
  <div id="mainScreen">
    <button class="btn" id="btnCreate">Создать комнату</button>
    <button class="btn blue" id="btnJoin">Войти</button>
  </div>
  <div id="createScreen" style="display:none">
    <p style="color:#aaa;font-size:13px">Код комнаты:</p>
    <div id="roomCode" style="font-size:30px;font-weight:800;letter-spacing:3px;color:#f55;margin:8px 0">----</div>
    <div id="playersList" style="margin:12px 0;color:#bbb;font-size:13px"></div>
    <button class="btn" id="btnStart">Начать</button>
    <div id="status"></div>
  </div>
  <div id="joinScreen" style="display:none">
    <input id="codeInput" placeholder="Код" maxlength="6">
    <br>
    <button class="btn blue" id="btnConnect">Войти</button>
    <button class="btn gray" id="btnBack">Назад</button>
    <div id="status2"></div>
  </div>
</div>

<div id="hud"><div id="role">—</div><div id="hpBar"><div id="hpFill"></div></div></div>
<div id="timer">2:00</div>
<div id="msg"></div>
<div id="joystick"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="attackBtn">АТАКА</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const socket=io();
let myId=null,isKiller=false,gameStarted=false,players={},myHp=100;
let joy={x:0,y:0};
let scene,camera,renderer,mapRoot=null,mapBounds=null;
let mapReady=false;
let mapHalfX=8,mapHalfZ=8;

function setStatus(t){
  document.getElementById('loading').textContent=t;
}

function loadMap(){
  const loader=new THREE.GLTFLoader();
  loader.load('/map.glb',(gltf)=>{
    mapRoot=gltf.scene;

    // Automatically fit the map to a reasonable game size.
    const rawBox=new THREE.Box3().setFromObject(mapRoot);
    const rawSize=rawBox.getSize(new THREE.Vector3());
    const maxDim=Math.max(rawSize.x,rawSize.y,rawSize.z);

    if(!isFinite(maxDim)||maxDim<=0){
      throw new Error('GLB имеет неправильный размер');
    }

    const TARGET_SIZE=18;
    const scale=TARGET_SIZE/maxDim;
    mapRoot.scale.setScalar(scale);
    mapRoot.updateMatrixWorld(true);

    // Center X/Z and put the lowest point on the game floor.
    let box=new THREE.Box3().setFromObject(mapRoot);
    const center=box.getCenter(new THREE.Vector3());
    mapRoot.position.x-=center.x;
    mapRoot.position.z-=center.z;
    mapRoot.position.y-=box.min.y;
    mapRoot.updateMatrixWorld(true);

    box=new THREE.Box3().setFromObject(mapRoot);
    mapBounds=box;
    mapHalfX=Math.max(2,(box.max.x-box.min.x)/2-0.6);
    mapHalfZ=Math.max(2,(box.max.z-box.min.z)/2-0.6);

    scene.add(mapRoot);

    // Fog adapts to the actual map size.
    const diagonal=Math.hypot(box.max.x-box.min.x,box.max.z-box.min.z);
    scene.fog=new THREE.Fog(0x0d0d14,Math.max(18,diagonal*0.7),Math.max(35,diagonal*1.8));

    mapReady=true;
    document.getElementById('loading').style.display='none';
    document.getElementById('menu').style.display='flex';
  },(xhr)=>{
    if(xhr.total){
      const pct=Math.round(xhr.loaded/xhr.total*100);
      setStatus('Загрузка карты… '+pct+'%');
    }
  },(err)=>{
    console.error('GLB load error:',err);
    setStatus('Ошибка загрузки map.glb');
  });
}

function initThree(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0d0d14);

  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
  camera.position.set(0,11,13);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,0.65));
  const d=new THREE.DirectionalLight(0xffffff,0.8);
  d.position.set(5,12,7);
  scene.add(d);
}

loadMap();
initThree();

document.getElementById('btnCreate').onclick=()=>socket.emit('createRoom','P'+Math.floor(Math.random()*90+10));
document.getElementById('btnJoin').onclick=()=>{
  document.getElementById('mainScreen').style.display='none';
  document.getElementById('joinScreen').style.display='block';
};
document.getElementById('btnBack').onclick=()=>{
  document.getElementById('joinScreen').style.display='none';
  document.getElementById('mainScreen').style.display='block';
};
document.getElementById('btnConnect').onclick=()=>{
  const code=document.getElementById('codeInput').value.trim().toUpperCase();
  socket.emit('joinRoom',{code,name:'P'+Math.floor(Math.random()*90+10)});
};
document.getElementById('btnStart').onclick=()=>socket.emit('startGame');

socket.on('roomCreated',code=>{
  document.getElementById('roomCode').textContent=code;
  document.getElementById('mainScreen').style.display='none';
  document.getElementById('createScreen').style.display='block';
});
socket.on('joined',d=>{
  myId=d.id;
  document.getElementById('roomCode').textContent=d.code;
  document.getElementById('mainScreen').style.display='none';
  document.getElementById('joinScreen').style.display='none';
  document.getElementById('createScreen').style.display='block';
});
socket.on('playersUpdate',list=>{
  players=list;
  document.getElementById('playersList').innerHTML=Object.values(list).map(p=>p.name).join(' • ');
});
socket.on('errorMsg',m=>{
  document.getElementById('status').textContent=m;
  document.getElementById('status2').textContent=m;
});
socket.on('gameStart',data=>{
  players=data.players;
  isKiller=data.killerId===myId;
  gameStarted=true;
  myHp=players[myId]?.hp||100;

  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('timer').style.display='block';
  document.getElementById('joystick').style.display='block';
  document.getElementById('role').textContent=isKiller?'УБИЙЦА':'Выживший';
  document.getElementById('role').style.color=isKiller?'#f55':'#4af';
  if(isKiller)document.getElementById('attackBtn').style.display='flex';
  updateHp();

  Object.values(players).forEach(p=>{
    p.mesh=makeCube(p.color,p.isKiller?1.35:1);
    p.mesh.position.set(
      Math.max(-mapHalfX+1,Math.min(mapHalfX-1,p.x)),
      0.5,
      Math.max(-mapHalfZ+1,Math.min(mapHalfZ-1,p.z))
    );
    p.x=p.mesh.position.x;p.z=p.mesh.position.z;
    scene.add(p.mesh);
  });
  loop();
});

socket.on('playerMoved',d=>{
  if(players[d.id]){
    players[d.id].targetX=d.x;
    players[d.id].targetZ=d.z;
  }
});
socket.on('hit',d=>{
  if(players[d.id])players[d.id].hp=d.hp;
  if(d.id===myId){
    myHp=d.hp;updateHp();
    if(myHp<=0)showMsg('Ты погиб');
  }
});
socket.on('timer',t=>{
  const m=Math.floor(t/60),s=t%60;
  document.getElementById('timer').textContent=m+':'+(s<10?'0':'')+s;
});
socket.on('gameOver',d=>{
  gameStarted=false;
  showMsg(d.winner==='killer'?'Убийца победил!':'Выжившие победили!');
});

function updateHp(){
  document.getElementById('hpFill').style.width=Math.max(0,myHp)+'%';
}
function showMsg(t){
  const e=document.getElementById('msg');
  e.textContent=t;e.style.display='block';
}
function makeCube(color,sc=1){
  const g=new THREE.BoxGeometry(sc,sc,sc);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:0.4}));
  m.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(g),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.2})
  ));
  return m;
}

const zone=document.getElementById('joystick'),knob=document.getElementById('joyKnob'),base=document.getElementById('joyBase');
let dragging=false;const MAX=32;
function joyMove(cx,cy){
  const r=base.getBoundingClientRect();
  const mx=r.left+r.width/2,my=r.top+r.height/2;
  let dx=cx-mx,dy=cy-my;
  const dist=Math.min(Math.hypot(dx,dy),MAX);
  const a=Math.atan2(dy,dx);
  dx=Math.cos(a)*dist;dy=Math.sin(a)*dist;
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  joy.x=dx/MAX;joy.y=dy/MAX;
}
zone.addEventListener('pointerdown',e=>{
  dragging=true;joyMove(e.clientX,e.clientY);zone.setPointerCapture(e.pointerId);
});
zone.addEventListener('pointermove',e=>{if(dragging)joyMove(e.clientX,e.clientY)});
const stop=()=>{
  dragging=false;knob.style.transform='translate(0,0)';joy.x=0;joy.y=0;
};
zone.addEventListener('pointerup',stop);
zone.addEventListener('pointercancel',stop);
document.getElementById('attackBtn').addEventListener('pointerdown',()=>{
  if(isKiller&&gameStarted)socket.emit('attack');
});

const SPEED=0.12;
function loop(){
  requestAnimationFrame(loop);
  if(!gameStarted)return;
  const me=players[myId];

  if(me&&me.mesh&&myHp>0){
    let dx=joy.x,dz=joy.y;
    if(dx||dz){
      const len=Math.hypot(dx,dz)||1;
      const sp=SPEED*(isKiller?1.3:1);
      dx=(dx/len)*sp;dz=(dz/len)*sp;

      me.mesh.position.x=Math.max(-mapHalfX,Math.min(mapHalfX,me.mesh.position.x+dx));
      me.mesh.position.z=Math.max(-mapHalfZ,Math.min(mapHalfZ,me.mesh.position.z+dz));
      me.x=me.mesh.position.x;me.z=me.mesh.position.z;
      socket.emit('move',{x:me.x,z:me.z});
    }
  }

  Object.values(players).forEach(p=>{
    if(p.id===myId||!p.mesh||p.targetX===undefined)return;
    p.mesh.position.x+=(p.targetX-p.mesh.position.x)*0.2;
    p.mesh.position.z+=(p.targetZ-p.mesh.position.z)*0.2;
  });

  if(me&&me.mesh){
    const t=me.mesh.position;
    camera.position.x+=(t.x-camera.position.x)*0.05;
    camera.position.z+=(t.z+12-camera.position.z)*0.05;
    camera.lookAt(t.x,0,t.z);
  }

  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  if(!camera)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
